<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Relax Maps · ArcGIS SceneView</title>
  <style>
    html, body { margin: 0; height: 100%; background: #02010a; color: #f4efe1; font: 15px/1.3 system-ui, sans-serif; }
    arcgis-scene { display: block; width: 100%; height: 100%; }
    .ctl { position: absolute; top: 8px; right: 8px; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; z-index: 5; max-width: 70%; }
    .ctl button { background: #1d2040e6; color: #f4efe1; border: 2px solid #3a3f6e; border-radius: 8px; padding: 5px 9px; font: inherit; cursor: pointer; }
    .ctl button.on { background: #ff6fa8; border-color: #ffb3cf; color: #0d0b1e; }
    #msg { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 20px; background: #02010a; z-index: 9; }
  </style>
  <!-- Optional key (window.RELAX_ARCGIS_KEY in config.js) unlocks keyed ArcGIS services; the default view needs none. -->
  <script src="../config.js"></script>
  <script>
    if (window.RELAX_ARCGIS_KEY) window.esriConfig = { apiKey: window.RELAX_ARCGIS_KEY };
    window.__relaxParentPost = (msg) => { try { if (parent !== window) parent.postMessage(Object.assign({ relaxMaps: 1 }, msg), location.origin); } catch (e) {} };
    window.__relaxFail = (msg) => {
      window.__relaxParentPost({ t: "error", msg: msg });
      if (parent !== window) return; // the Maps app shows the error with Retry / switch buttons
      var old = document.getElementById("msg");
      if (old) old.remove();
      var d = document.createElement("div");
      d.id = "msg";
      d.textContent = "⚠ " + msg;
      document.body.appendChild(d);
    };
    // ArcGIS SceneView needs WebGL2
    (function () {
      var c = document.createElement("canvas");
      if (!c.getContext("webgl2")) window.__relaxNoGL2 = true;
    })();
  </script>
  <!-- ArcGIS Maps SDK for JavaScript 5.1: one entry point loads the components and the core API -->
  <script type="module" src="https://js.arcgis.com/5.1/" onerror="window.__relaxFail('The ArcGIS SDK didn\'t load (blocked or offline CDN).')"></script>
</head>
<body>
  <arcgis-scene id="scene" basemap="satellite" ground="world-elevation" camera-position="10, 25, 18000000" camera-tilt="0" quality-profile="medium">
    <arcgis-zoom slot="top-left"></arcgis-zoom>
    <arcgis-navigation-toggle slot="top-left"></arcgis-navigation-toggle>
    <arcgis-compass slot="top-left"></arcgis-compass>
  </arcgis-scene>
  <div class="ctl">
    <button type="button" data-basemap="satellite" class="on">Satellite</button>
    <button type="button" data-basemap="hybrid">Labels</button>
    <button type="button" data-basemap="topo-vector">Topo</button>
    <button type="button" id="home">🌍 Earth</button>
  </div>
  <script type="module">
    const post = window.__relaxParentPost;
    const fail = window.__relaxFail;
    if (window.__relaxNoGL2) {
      fail("ArcGIS SceneView needs WebGL2, which this device/browser doesn't offer. Try Globe.gl instead.");
    } else {
      const scene = document.getElementById("scene");
      let readyDone = false;
      const timeout = setTimeout(() => readyDone || fail("ArcGIS SceneView didn't start in time."), 28000);

      scene.addEventListener("arcgisViewReadyError", () => {
        clearTimeout(timeout);
        fail("ArcGIS SceneView hit a rendering or content error.");
      });

      const goTo = (p, duration = 2600) => {
        const target = { center: [p.lng, p.lat], zoom: p.zoom || 12, tilt: p.tilt ?? 65, heading: p.heading || 0 };
        return scene.goTo(target, { duration, easing: "in-out-cubic" }).catch(() => {});
      };

      customElements.whenDefined("arcgis-scene").then(async () => {
        try {
          await scene.viewOnReady();
        } catch (e) {
          clearTimeout(timeout);
          return fail("ArcGIS SceneView couldn't start: " + (e && e.message ? e.message : e));
        }
        readyDone = true;
        clearTimeout(timeout);
        for (const b of document.querySelectorAll("[data-basemap]")) {
          b.addEventListener("click", () => {
            scene.basemap = b.dataset.basemap;
            for (const o of document.querySelectorAll("[data-basemap]")) o.classList.toggle("on", o === b);
          });
        }
        document.getElementById("home").addEventListener("click", () =>
          scene.goTo({ position: { longitude: 10, latitude: 25, z: 18000000 }, tilt: 0, heading: 0 }, { duration: 2200 }).catch(() => {}));

        scene.addEventListener("arcgisViewClick", (e) => {
          const p = e.detail && e.detail.mapPoint;
          if (p && Number.isFinite(p.latitude) && Number.isFinite(p.longitude)) post({ t: "pick", lat: p.latitude, lng: p.longitude });
        });

        addEventListener("message", (e) => {
          if (e.origin !== location.origin) return;
          const m = e.data;
          if (m && m.relaxMaps === 1 && m.t === "fly" && Number.isFinite(m.lat) && Number.isFinite(m.lng)) goTo(m);
        });

        const h = new URLSearchParams(location.hash.slice(1));
        const lat = Number(h.get("lat")), lng = Number(h.get("lng"));
        if (h.has("lat") && Number.isFinite(lat) && Number.isFinite(lng)) goTo({ lat, lng, zoom: 12, tilt: 65 }, 0);

        post({ t: "ready", engine: "arcgis" });
      });
    }
  </script>
</body>
</html>
